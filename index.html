<!DOCTYPE html>
<html lang="cs">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>František Lachman | Webmaster & AI Developer</title>

    <meta
        name="description"
        content="Moderní weby, AI automatizace a IT řešení. Osobní portfolio Františka Lachmana."
    >

    <meta name="theme-color" content="#eefcff">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/effects.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/animations.css">

</head>

<body>

    <!-- ==================================================
         BACKGROUND
    =================================================== -->

    <div class="page-background" aria-hidden="true">

        <div class="blob blob-1"></div>

        <div class="blob blob-2"></div>

        <div class="blob blob-3"></div>

        <div class="wave"></div>

        <div class="noise"></div>

    </div>

    <!-- ==================================================
         HEADER
    =================================================== -->

    <header>

        <nav class="navbar">

            <div class="logo">

                FL

            </div>

            <div class="nav-controls">

                <!-- Language -->

                <div class="segmented" id="language-switch">

                    <span class="slider"></span>

                    <button
                        type="button"
                        class="active"
                        aria-label="Čeština">

                        CZ

                    </button>

                    <button
                        type="button"
                        aria-label="English">

                        EN

                    </button>

                </div>

                <!-- Theme -->

                <div class="segmented" id="theme-switch">

                    <span class="slider"></span>

                    <button
                        type="button"
                        class="active"
                        aria-label="Light mode">

                        ☀️

                    </button>

                    <button
                        type="button"
                        aria-label="Dark mode">

                        🌙

                    </button>

                </div>

            </div>

        </nav>

    </header>

    <!-- ==================================================
         MAIN
    =================================================== -->

    <main>

        <section class="hero" id="home">

            <article class="glass-card hero-card">

                <div class="hero-status">

    <span class="status-dot"></span>

    <span data-lang="status">

        K dispozici pro nové projekty

    </span>

</div>
                <h1>

                    František Lachman

                </h1>

                <h2 data-lang="subtitle">

 · Web Developer · AI

</h2>

               <p data-lang="description">

    Moderní weby, automatizace, AI řešení a IT služby.

</p>

                <div class="hero-buttons">

                   <a
    href="#portfolio"
    class="btn btn-primary"
    data-lang="portfolio">

    Portfolio →

</a>

                    <a
    href="#contact"
    class="btn btn-glass"
    data-lang="contact">

    Kontakt

</a>
                </div>

                <div class="hero-social">

                    <a href="#" aria-label="GitHub">

                        GitHub

                    </a>

                    <a href="#" aria-label="LinkedIn">

                        LinkedIn

                    </a>

                    <a href="mailto:info@frantiseklachman.com" aria-label="Email">

                        Email

                    </a>

                </div>

            </article>

        </section>

        <!-- ==================================================
             FUTURE SECTIONS
        =================================================== -->

        <section id="portfolio"></section>

        <section id="contact"></section>

    </main>

    <!-- JS -->

    <script src="js/theme.js"></script>
    <script src="js/language.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
