<!DOCTYPE html>
<html lang="cs">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>František Lachman | Webmaster</title>

    <meta
        name="description"
        content="Portfolio a osobní web Františka Lachmana."
    >

    <!-- CSS -->

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navigation.css">

    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/hero.css">

    <link rel="stylesheet" href="css/effects.css">
    <link rel="stylesheet" href="css/animations.css">

</head>

<body>

    <!-- =========================
         BACKGROUND
    ========================== -->

    <div class="page-background">

        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <div class="wave"></div>

        <div class="noise"></div>

    </div>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <header>

        <nav class="navbar">

            <div class="logo">
                FL
            </div>

            <div class="nav-controls">

                <div class="segmented" id="language-switch">

                    <span class="slider"></span>

                    <button class="active">CZ</button>
                    <button>EN</button>

                </div>

                <div class="segmented" id="theme-switch">

                    <span class="slider"></span>

                    <button class="active">☀️</button>
                    <button>🌙</button>

                </div>

            </div>

        </nav>

    </header>


    <!-- =========================
         HERO
    ========================== -->

    <main>

        <section class="hero">

            <div class="glass-card hero-card">

                <div class="hero-status">

                    <span class="status-dot"></span>

                    Available for Projects

                </div>

                <h1>
                    František Lachman
                </h1>

                <h2>
                    Freelancer · Web Developer · AI
                </h2>

                <p>
                    Moderní weby, automatizace, AI řešení a IT služby.
                </p>

                <div class="hero-buttons">

                    <a href="#portfolio" class="btn btn-primary">
                        Portfolio
                    </a>

                    <a href="#kontakt" class="btn btn-glass">
                        Kontakt
                    </a>

                </div>

                <div class="hero-social">

                    <a href="#">GitHub</a>
                    <a href="#">LinkedIn</a>
                    <a href="#">Email</a>

                </div>

            </div>

        </section>

    </main>


    <!-- JS -->

    <script src="js/theme.js"></script>
    <script src="js/language.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
