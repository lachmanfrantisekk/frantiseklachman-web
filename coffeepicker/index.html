<!DOCTYPE html>
<html lang="cs">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee Picker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>

    </div>

    <!-- App -->

    <main class="app">

        <div class="card">

            <h1>Coffee Picker</h1>

            <div class="progress">

                <div class="progress-bar"></div>

            </div>

            <span class="step">

                Otázka 1 z 6

            </span>

            <h2>

                Chceš kofein?

            </h2>

            <div class="answers">

                <button>Ano</button>

                <button>Bez kofeinu</button>

            </div>

        </div>

    </main>

<script src="coffee-data.js"></script>
<script src="script.js"></script>

</body>

</html>
